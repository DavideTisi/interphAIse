[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "interphaise"
version = "0.0.1"
description = "LLM-orchestrated construction of solid-solid battery interfaces and interphases (OSI Hackathon 2026)"
requires-python = ">=3.11"
dependencies = [
    "pymatgen==2026.9.24",
    "pymatgen-core==2026.10.16",
    "ase>=3.23",
    "numpy",
    "scipy",
    "pydantic>=2",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
llm = ["litellm", "anthropic"]
mp = ["mp-api>=0.47.0"]
mlip = ["torch", "mace-torch"]
petmad = ["pet-mad"]
upet = ["upet"]
dev = ["pytest"]
analysis = ["matplotlib==3.11.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["interphaise*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
