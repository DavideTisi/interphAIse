<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="406" viewBox="0 0 1000 406" role="img" aria-labelledby="title description">
<title id="title">Prospective interface tests</title>
<desc id="description">Humans fix a buildable menu, reference results, contact geometries and budget. The LLM selects a coating and predicts adhesion ranges for both contacts and the weaker contact. Code archives the choice and forecasts before new energies exist. ASE and PET-MAD calculate adhesion on the frozen interfaces; primary results are validated. The LLM assesses its predictions and chooses again within the pilot budget. Sensitivity results remain withheld until the final summary. Model names belong to the archived experiment provenance, not to these role labels.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#667786"/></marker>
<marker id="feedback-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087f8c"/></marker>
</defs>
<rect width="1000" height="406" rx="12" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="39" font-size="26" font-weight="700" fill="#172b3a" text-anchor="start">Prospective interface tests</text>
<text x="28" y="67" font-size="17" font-weight="400" fill="#526472" text-anchor="start">Do the LLM&#x27;s adhesion forecasts survive a new physical calculation?</text>
<text x="28" y="106" font-size="15" font-weight="700" fill="#172b3a" text-anchor="start">Humans define</text>
<text x="146" y="106" font-size="15" font-weight="400" fill="#526472" text-anchor="start">Buildable menu, reference results, contact geometries and calculation budget</text>
<path d="M28 121 H972" stroke="#d9e0e5"/>
<rect x="28" y="142" width="206" height="144" rx="12" fill="#e3f3f1" stroke="#087f8c" stroke-width="1.5"/>
<text x="131" y="164" font-size="11.5" font-weight="700" fill="#0b5a63" text-anchor="middle">LLM</text>
<text x="131" y="195" font-size="18" font-weight="600" fill="#172b3a" text-anchor="middle">Choose a coating</text>
<text x="131" y="219" font-size="18" font-weight="600" fill="#172b3a" text-anchor="middle">and predict adhesion</text>
<text x="131" y="247" font-size="13" font-weight="400" fill="#526472" text-anchor="middle">Two ranges + weaker contact</text>
<path d="M239 214 H267" fill="none" stroke="#667786" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="274" y="142" width="206" height="144" rx="12" fill="#f1f4f7" stroke="#8a99a8" stroke-width="1.5"/>
<text x="377" y="164" font-size="11.5" font-weight="700" fill="#526472" text-anchor="middle">CODE</text>
<text x="377" y="195" font-size="18" font-weight="600" fill="#172b3a" text-anchor="middle">Archive forecasts</text>
<text x="377" y="219" font-size="18" font-weight="600" fill="#172b3a" text-anchor="middle">before calculations</text>
<text x="377" y="247" font-size="13" font-weight="400" fill="#526472" text-anchor="middle">Save the decision-time evidence</text>
<path d="M485 214 H513" fill="none" stroke="#667786" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="520" y="142" width="206" height="144" rx="12" fill="#f1f4f7" stroke="#8a99a8" stroke-width="1.5"/>
<text x="623" y="164" font-size="11.5" font-weight="700" fill="#526472" text-anchor="middle">ATOMISTIC CALCULATION</text>
<text x="623" y="195" font-size="18" font-weight="600" fill="#172b3a" text-anchor="middle">Calculate adhesion</text>
<text x="623" y="219" font-size="18" font-weight="600" fill="#172b3a" text-anchor="middle">at both contacts</text>
<text x="623" y="247" font-size="13" font-weight="400" fill="#526472" text-anchor="middle">ASE + PET-MAD</text>
<text x="623" y="266" font-size="13" font-weight="400" fill="#526472" text-anchor="middle">Validate primary results</text>
<path d="M731 214 H759" fill="none" stroke="#667786" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="766" y="142" width="206" height="144" rx="12" fill="#e3f3f1" stroke="#087f8c" stroke-width="1.5"/>
<text x="869" y="164" font-size="11.5" font-weight="700" fill="#0b5a63" text-anchor="middle">LLM</text>
<text x="869" y="195" font-size="18" font-weight="600" fill="#172b3a" text-anchor="middle">Assess predictions</text>
<text x="869" y="219" font-size="18" font-weight="600" fill="#172b3a" text-anchor="middle">and revise the idea</text>
<text x="869" y="247" font-size="13" font-weight="400" fill="#526472" text-anchor="middle">Read validated feedback</text>
<path d="M869 291 V320 H131 V291" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#feedback-arrow)"/>
<text x="500" y="347" font-size="16" font-weight="600" fill="#087f8c" text-anchor="middle">Feedback: Validated adhesion and weaker-contact results inform the next choice</text>
<text x="500" y="382" font-size="13.5" font-weight="400" fill="#526472" text-anchor="middle">Predictions are saved first. Withheld sensitivity results are released only after the final summary.</text>
</g>
</svg>
